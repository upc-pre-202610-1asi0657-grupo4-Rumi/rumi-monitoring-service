# Development profile: runs with no external infrastructure.
# Start with --spring.profiles.active=dev
spring:
  datasource:
    url: jdbc:h2:mem:sensorreadingsdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

rumi:
  messaging:
    # SensorReadingRecordedPublisher logs the event instead of sending it to RabbitMQ.
    enabled: false
