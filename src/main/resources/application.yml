server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: rumi-monitoring-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # This service owns sensorreadingsdb (TimescaleDB on PostgreSQL).
  datasource:
    url: ${MONITORING_DB_URL:jdbc:postgresql://localhost:5432/sensorreadingsdb}
    username: ${MONITORING_DB_USERNAME:postgres}
    password: ${MONITORING_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    # No migration tool yet: Hibernate keeps the schema up to date. Converting
    # sensor_readings into a TimescaleDB hypertable is a manual step for now.
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
